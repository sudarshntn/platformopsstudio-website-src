name: CI

on:
  push:
    branches: [next-rebuild, main]
  pull_request:
    branches: [next-rebuild, main]

jobs:
  # Fast lane — runs on every push and PR. Blocks merge if red.
  lint-type-unit:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs in parallel via three independent steps — GitHub reports
      # each with its own line so a red step is immediately clear.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Slow lane — Playwright + axe against a real production build.
  # Runs on the same triggers but on a separate job so unit failures
  # surface without waiting for e2e.
  e2e:
    name: E2E · Axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
