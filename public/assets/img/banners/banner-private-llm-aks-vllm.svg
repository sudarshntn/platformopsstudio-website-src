<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Inconsolata', 'SFMono-Regular', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1a3a"/>
      <stop offset="55%" stop-color="#06070b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3a7dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a7dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#3a7dff" stroke-opacity="0.25" stroke-width="2"/>

  <rect x="64" y="42" width="252" height="40" rx="20" fill="#3a7dff" fill-opacity="0.15" stroke="#3a7dff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="82" y="68" font-size="16" font-weight="700" letter-spacing="1.5" fill="#3a7dff">LLMOPS · AKS · vLLM</text>
  <text x="64" y="220" font-size="40" font-weight="700" fill="#ffffff"><tspan x="64" dy="0">Your Models, Your Network:</tspan><tspan x="64" dy="50">A Private LLM Platform on</tspan><tspan x="64" dy="50">Azure AKS with vLLM</tspan></text>

  <g transform="translate(960,330)" stroke="#3a7dff" fill="none" stroke-width="3" opacity="0.9">
    <circle r="170" stroke-opacity="0.25" stroke-width="1.5"/>

    <rect x="-120" y="-100" width="240" height="200" rx="16" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="10 8"/>

    <g stroke-opacity="0.85" stroke-width="2.5">
      <line x1="-30" y1="-74" x2="-30" y2="-56"/>
      <line x1="0" y1="-74" x2="0" y2="-56"/>
      <line x1="30" y1="-74" x2="30" y2="-56"/>
      <line x1="-30" y1="56" x2="-30" y2="74"/>
      <line x1="0" y1="56" x2="0" y2="74"/>
      <line x1="30" y1="56" x2="30" y2="74"/>
      <line x1="-74" y1="-30" x2="-56" y2="-30"/>
      <line x1="-74" y1="0" x2="-56" y2="0"/>
      <line x1="-74" y1="30" x2="-56" y2="30"/>
      <line x1="56" y1="-30" x2="74" y2="-30"/>
      <line x1="56" y1="0" x2="74" y2="0"/>
      <line x1="56" y1="30" x2="74" y2="30"/>
    </g>

    <rect x="-56" y="-56" width="112" height="112" rx="10" fill="#0d1a3a"/>
    <rect x="-28" y="-28" width="56" height="56" rx="5" stroke-opacity="0.8" stroke-width="2.5"/>
    <circle r="9" fill="#3a7dff" stroke="none"/>
  </g>

  <text x="64" y="580" font-size="20" font-weight="700" fill="#ffffff">PlatformOpsStudio</text>
  <text x="64" y="606" font-size="15" fill="#8a90a3">medium.com/@ramsudarsan</text>
