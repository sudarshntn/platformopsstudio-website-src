<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Inconsolata', 'SFMono-Regular', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1a3a"/>
      <stop offset="55%" stop-color="#06070b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3a7dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a7dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#3a7dff" stroke-opacity="0.25" stroke-width="2"/>

  <rect x="64" y="42" width="268" height="40" rx="20" fill="#3a7dff" fill-opacity="0.15" stroke="#3a7dff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="82" y="68" font-size="16" font-weight="700" letter-spacing="1.5" fill="#3a7dff">KAFKA · CONFLUENT CLOUD</text>
  <text x="64" y="220" font-size="42" font-weight="700" fill="#ffffff"><tspan x="64" dy="0">Connecting Confluent Cloud</tspan><tspan x="64" dy="52">Kafka to Self-Hosted Kafka</tspan><tspan x="64" dy="52">with Cluster Linking</tspan></text>

  <g transform="translate(960,340)" stroke="#3a7dff" fill="none" stroke-width="3" opacity="0.9">
    <circle r="170" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <g transform="translate(-90,0)">
      <ellipse cx="0" cy="-30" rx="34" ry="12"/>
      <path d="M -34 -30 L -34 30 A 34 12 0 0 0 34 30 L 34 -30"/>
