  <text x="64" y="220" font-size="48" font-weight="700" fill="#ffffff"><tspan x="64" dy="0">The End of On-Call</tspan><tspan x="64" dy="66">As We Know It</tspan></text>

  <g transform="translate(960,340)" stroke="#3a7dff" fill="none" stroke-width="3" opacity="0.9">
    <circle r="170" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <path d="M-60 40 C-60 -60 -40 -110 0 -110 C40 -110 60 -60 60 40 L80 70 H-80 Z"/>
    <path d="M-20 70 C-20 90 20 90 20 70" stroke-width="5"/>
