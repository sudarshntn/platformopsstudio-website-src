allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides for vulnerable transitive dependencies.
#
# Each key is scoped to the vulnerable RANGE so only the bad instance is
# replaced — other copies already on a patched version are left alone
# (e.g. postcss 8.5.26, pulled in by @tailwindcss/postcss, is untouched).
#
# Re-check these against `pnpm audit` after any Next.js upgrade; once an
# upstream release pulls in the patched version on its own, the matching
# override here becomes dead weight and should be deleted.
overrides:
  # HIGH — arbitrary file read / path traversal via attacker-controlled
  # sourceMappingURL in CSS comments. next@15.5.25 pins postcss to an exact
  # 8.4.31, so the fix has to come from here. Build-time only; postcss 8.x
  # is semver-compatible.
  postcss@<8.5.18: ^8.5.28

  # HIGH — inherited libvips and libheif CVEs. sharp backs next/image
  # optimization, so this is the one vulnerability in the set that runs in
  # production. next@15.5.25 already declares `^0.34.3 || ^0.35.4` in its
  # optionalDependencies, so 0.35.x is a version Next explicitly supports.
  sharp@<0.35.4: ^0.35.5

  # HIGH — DoS via uncontrolled recursion on nested brace groups. Two
  # separate majors are in the tree via the eslint/minimatch chain; both
  # are dev-only.
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
# NOT overridable — `braces` (HIGH, stack-exhaustion DoS) has no patched
# release: 3.0.3 is both the vulnerable version and the latest published
# one, so `pnpm audit` will keep reporting it until upstream ships a fix.
# It reaches the tree only through devDependencies
# (eslint-config-next > fast-glob > micromatch, and lint-staged >
# micromatch), so it is never part of the deployed bundle. Nothing to do
# here beyond re-checking when micromatch or braces publishes.
